id: bifrost
title: "Family AI Gateway"
version: 0.1.0.0
release-notes: "Initial release of Bifrost AI Gateway."
license: Apache-2.0
wrapper-repo: "https://github.com/upoi/family-ai-gateway"
upstream-repo: "https://github.com/maximhq/bifrost"
support-site: "https://getmaxim.ai/bifrost"
build: ["make"]
description:
  short: Bifrost AI Gateway
  long: Bifrost AI Gateway - Unified API for AI providers
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
main:
  type: docker
  image: main
  entrypoint: "sh"
  args: ["-c", "/docker_entrypoint.sh"]
  user: root
  mounts:
    main: /app/data
volumes:
  main:
    type: data
health-checks:
  web-ui:
    name: "Web UI"
    success-message: Bifrost is accessible
    type: script
interfaces:
  main:
    name: Bifrost API
    description: Bifrost AI Gateway
    tor-config:
      port-mapping:
        80: "8080"
    lan-config:
      443:
        ssl: true
        internal: 8080
    ui: true
    protocols:
      - tcp
      - http
config: ~
properties: ~
dependencies: {}
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /app/data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/app/data"
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /app/data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/app/data"      